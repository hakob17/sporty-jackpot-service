server:
  port: 8080

spring:
  application:
    name: jackpot-service

  datasource:
    url: jdbc:h2:mem:jackpotdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: jackpot-bets-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sporty.jackpot.dto
        spring.json.value.default.type: com.sporty.jackpot.dto.Bet
        spring.json.use.type.headers: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  kafka:
    # false -> the bet is handled in-process (payload is logged) and no broker is needed.
    enabled: ${KAFKA_ENABLED:true}
    topic:
      jackpot-bets: jackpot-bets

logging:
  level:
    com.sporty.jackpot: info

---
# Run without any infrastructure: mvn spring-boot:run -Dspring-boot.run.profiles=no-kafka
spring:
  config:
    activate:
      on-profile: no-kafka
app:
  kafka:
    enabled: false
